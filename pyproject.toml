[project]
name = "textframe"
version = "0.1.0"
description = "Text renderer with a double border and 2x scaling"
readme = "README.md"
authors = [
    { name = "Riflusso", email = "vadim2005110@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyopengl>=3.1.10",
    "pysdl3>=0.9.12b1",
    "vulkan-py>=1.1.0",
]

[project.scripts]
textframe = "textframe:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
